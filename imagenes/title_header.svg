<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="100%" height="140" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@500;600;700&amp;display=swap');
      
      .brand-title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 56px;
        letter-spacing: -1px;
      }
      
      .brand-subtitle {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 17px;
        letter-spacing: 0.5px;
      }
      
      .glow {
        filter: drop-shadow(0 0 20px rgba(56, 189, 248, 0.4));
      }
    </style>
    
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- Background decorative glow -->
  <circle cx="425" cy="50" r="130" fill="#6366F1" opacity="0.1" filter="blur(40px)" />

  <!-- Logo Title -->
  <g class="glow" text-anchor="middle">
    <text x="425" y="68" class="brand-title">
      <tspan fill="#FFFFFF">⚡ TASK </tspan><tspan fill="url(#cyberGrad)">PULSE</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="425" y="108" class="brand-subtitle" fill="url(#subGrad)">
      Gestor Inteligente de Productividad y Metas Diarias
    </text>
  </g>
</svg>
